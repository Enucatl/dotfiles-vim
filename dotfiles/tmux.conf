# Mouse support for scrolling, selecting panes, and resizing.
set -g mouse on

# Start window and pane numbering at 1, and keep window numbers contiguous.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep more scrollback and use familiar vi keys in copy mode.
set -g history-limit 10000
setw -g mode-keys vi

# Easier pane splitting.
bind | split-window -h
bind - split-window -v

# Reload this configuration with Prefix + r.
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"
